name: Construir APK CORE Bitácora de Paradas (previa)
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar app
        run: |
          npm ci
          node scripts/prepare-android.cjs
          npx cap sync android
      - name: Pruebas del motor de cálculo (Node, sin dependencias)
        run: node tests/core-calculo.test.cjs
      - name: Compilar APK
        working-directory: android
        run: sh gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: core-bitacora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
