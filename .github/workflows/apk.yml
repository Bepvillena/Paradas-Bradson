name: Construir APK

# Se ejecuta solo cada vez que subes cambios, o a mano desde la pestaña
# Actions -> "Construir APK" -> "Run workflow". El APK queda al final de la
# ejecución, en la sección "Artifacts" (archivo paradas-bradson-apk).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: npm install

      # Solo lo que la app necesita (sin archivos de prueba ni documentos sueltos)
      - name: Armar carpeta www
        run: |
          mkdir www
          cp index.html styles.css engine.js local-db.js seed-data.js pets-links.js firebase-config.js manifest.json sw.js www/
          cp -r assets icons www/

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      # Android 11+ exige declarar que la app puede abrir archivos con otras apps
      # (para el botón que abre el Word/PDF con Word, WPS, visor de PDF…)
      - name: Permitir abrir archivos con otras apps
        run: |
          sed -i 's|<application|<queries><intent><action android:name="android.intent.action.VIEW"/><data android:mimeType="*/*"/></intent></queries>\n    <application|' android/app/src/main/AndroidManifest.xml

      # Ícono de la app (Android) a partir de la carpeta resources/
      - name: Generar íconos
        run: npx capacitor-assets generate --android --assetPath resources

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: paradas-bradson-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
